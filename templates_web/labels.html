{% extends "base.html" %}
{% block content %}
<h2>QR налепници</h2>
<form method="get" class="row g-2 mb-3">
<div class="col-12 col-md-3"><label>Статус</label>
<input class="form-control" name="status" value="{{ st }}"></div>
<div class="col-12 col-md-3"><label>Тип</label>
<input class="form-control" name="type" value="{{ tp }}"></div>
<div class="col-12 col-md-3"><label>Локација</label>
<input class="form-control" name="loc" value="{{ loc }}"></div>
<div class="col-12 col-md-3 d-flex align-items-end gap-2">
<button class="btn btn-primary" type="submit">Филтрирај</button>
<button class="btn btn-secondary" type="button" onclick="window.print()">Печати</button>
</div>
</form>
{% if rows %}
<div class="row g-3">
{% for r in rows %}
<div class="col-6 col-md-3">
<div class="card sd-card text-center"><div class="card-body">
<img src="/qr/{{ r.AssetID }}" alt="QR {{ r.AssetID }}" width="140" height="140" loading="lazy">
<div class="mt-2"><b>{{ r.AssetID }}</b></div>
<div class="text-muted small">{{ r.Manufacturer }} {{ r.Model }}</div>
<div class="text-muted small">SN: {{ r.SerialNumber }}</div>
</div></div>
</div>
{% endfor %}
</div>
{% else %}
<div class="empty-state">Нема уреди за избраните филтри.</div>
{% endif %}
{% endblock %}
