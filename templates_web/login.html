{% extends "base.html" %}
{% block content %}
<h2>Најава</h2>
<form method="post">
<div class="mb-3"><label>Корисничко име</label>
<input class="form-control" name="username" required autocomplete="username"></div>
<div class="mb-3"><label>Лозинка</label>
<input class="form-control" type="password" name="password" required autocomplete="current-password"></div>
<button class="btn btn-primary" type="submit">Најави се</button>
</form>
{% endblock %}
