{% extends "base.html" %}
{% block content %}
<h2>Пакети опрема</h2>
<div class="row g-2">
{% for p in packages %}
<div class="col-12 col-md-6 col-xl-4"><div class="card sd-card anim-in"><div class="card-body p-3">
<div class="d-flex justify-content-between align-items-start gap-2">
<div><h5 class="mb-1">{{ p.name }}</h5>
<div class="text-muted small">{{ p.description }}</div>
<div class="small mt-1">Содржи: {{ p.types|join(", ") }}</div></div>
<a class="btn btn-primary btn-sm text-nowrap" href="/package/{{ p.id }}">Додели пакет</a>
</div>
</div></div></div>
{% endfor %}
</div>
{% endblock %}
