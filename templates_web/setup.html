{% extends "base.html" %}
{% block content %}
<h2>Почетно поставување</h2>
<p class="text-muted">Создајте го првиот администратор. По ова најавувањето станува задолжително.</p>
<form method="post">
<div class="mb-3"><label>Корисничко име</label>
<input class="form-control" name="username" required autocomplete="username"></div>
<div class="mb-3"><label>Лозинка (мин. 8 знаци)</label>
<input class="form-control" type="password" name="password" required autocomplete="new-password"></div>
<button class="btn btn-primary" type="submit">Креирај администратор</button>
</form>
{% endblock %}
