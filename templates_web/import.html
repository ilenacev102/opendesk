{% extends "base.html" %}
{% block content %}
<h2>Bulk Import (CSV)</h2>
{% if report %}
{% if report.ok %}
<div class="alert alert-success">Внесени {{ report.ok }} реда.</div>
{% endif %}
{% for e in report.errors %}
<div class="alert alert-danger">{{ e }}</div>
{% endfor %}
{% endif %}
<form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
<div class="mb-3"><label>Тип</label>
<select class="form-control" name="kind">
<option value="devices">Уреди (AssetID,Type,Manufacturer,Model,SerialNumber,Status,EmployeeID,Location,PurchaseDate,WarrantyUntil,Notes)</option>
<option value="employees">Вработени (EmployeeID,FirstName,LastName,UserName,Email,Department,Organization,Location,Active)</option>
</select></div>
<div class="mb-3"><label>CSV фајл</label>
<input class="form-control" type="file" name="file" accept=".csv" required></div>
<button class="btn btn-primary" type="submit">Внеси</button>
</form>
<p class="mt-3"><a href="/reports?export=devices">Симни уреди (CSV)</a> |
<a href="/reports?export=employees">Симни вработени (CSV)</a></p>
{% endblock %}
